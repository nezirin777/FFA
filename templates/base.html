<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Script-Type" content="text/javascript">
    <meta http-equiv="Content-Style-Type" content="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.main_title }}{% endblock %}</title>
    
    <!-- 新設計の分離CSSの読み込み -->
    <link rel="stylesheet" href="html/new_common.css" type="text/css">
    <link rel="stylesheet" href="html/new_game.css?v=8" type="text/css">
    <!-- モバイル補正は狭い画面だけに適用し、PC用レイアウトを上書きしない。 -->
    <link rel="stylesheet" href="html/mobile.css?v=4" type="text/css" media="screen and (max-width: 768px)">
    {% block head %}{% endblock %}
</head>
<body{% if page_background %} style="background-image: url('{{ page_background }}');"{% endif %}>

    <!-- メインコンテンツ -->
    <div id="main-content">
        {% block content %}{% endblock %}
    </div>

    <div id="toast-container" class="toast-top-center" aria-live="polite" aria-atomic="true"></div>

    <div id="overlay" class="hidden" aria-hidden="true">
        <div class="overlay-content">
            <div class="spinner" aria-hidden="true"></div>
            <div class="overlay-text" role="status">処理中...</div>
        </div>
    </div>

    <div id="confirm-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-message">
        <div class="modal-box">
            <p id="confirm-message">実行しますか？</p>
            <div class="modal-buttons">
                <button type="button" id="confirm-ok" class="btn">はい</button>
                <button type="button" id="confirm-cancel" class="btn btn-secondary">キャンセル</button>
            </div>
        </div>
    </div>

    <!-- 共通フッター -->
    {% block footer %}
    <footer class="site-footer">
    <hr class="site-footer__rule">
    <div class="site-footer__navigation">
        <a href="{{ config.others_script }}">【{{ config.main_title }} TOP】</a>
    </div>
    <hr class="site-footer__separator">
    <div class="site-footer__version">
        FFA改 Vips Ver 3.00 (Original ver2.00 edit by <a href="http://www.eriicu.com" target="_blank" rel="noopener noreferrer">いく</a>)<br>
        FFA Emilia Ver1.01 remodeled by Classic<br>
    </div>
    </footer>
    {% endblock %}

    <script type="text/javascript">
        window.FFA_FLASH_MESSAGES = {{ flash_messages | default([]) | tojson }};
    </script>
    <script src="html/main.js?v=6" type="text/javascript"></script>

</body>
</html>
